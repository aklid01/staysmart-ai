[project]
name = "staysmart-ai"
version = "0.1.0"
description = "MCP-powered hotel discovery and recommendation MVP"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pydantic>=2.12,<3",
    "python-dotenv>=1.0",
    "mcp>=2.3,<3",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "fastembed>=0.3",
    "numpy>=1.26",
    "openai>=1.40",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/staysmart"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
